# Tech Migration AI — Phase 1: Basic AI Chat
#
# Next.js chat UI -> FastAPI backend -> local Ollama LLM (streaming).
# Postgres + Qdrant are defined for later phases and stay idle in Phase 1.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:14b}
      # Ollama runs on the host (GPU stays simple). From inside Docker,
      # the host is reachable via host.docker.internal.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - DATABASE_URL=${DATABASE_URL:-postgresql://techmigration:techmigration@postgres:5432/techmigration}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # --- Phase 2+ services (idle in Phase 1) --------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=techmigration
      - POSTGRES_USER=techmigration
      - POSTGRES_PASSWORD=techmigration
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techmigration -d techmigration"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  qdrantdata:
